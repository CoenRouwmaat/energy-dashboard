[project]
name = "energy-dashboard"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "CoenRouwmaat", email = "coenrouwmaat@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
energy-dashboard = "energy_dashboard:main"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "git-cliff>=2.14.2",
    "ipykernel>=7.4.0",
    "prek>=0.5.5",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]
